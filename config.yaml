# Reference defaults (the CLI flags are the source of truth; this documents them).
max_pages: 30
max_depth: 2
per_shape_limit: 3            # max pages crawled per endpoint "shape" (kills ?id=N explosion)
max_file_bytes: 1048576      # 1 MiB per response/file
max_total_bytes: 10485760    # 10 MiB total for local file scans
timeout_seconds: 10
request_delay_seconds: 0.25
user_agent: FlagHunter-CTF/2.0 (authorized-lab-scan)
# Default allowed ports (plus the target's own port and anything via --ports/--allow-any-port)
default_ports: [80, 443, 8000, 8080, 8443, 3000, 5000, 8888, 8081, 9000]
